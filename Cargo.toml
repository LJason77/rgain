[package]
name = "rgain"
version = "0.1.0"
authors = ["LJason <ljason@ljason77.com>"]
edition = "2024"
license-file = "LICENSE"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ebur128 = "0.1"
hex = "0.4"
lofty = "0.24"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }

[dependencies.symphonia]
version = "0.6"
default-features = false
features = ["mpa", "flac", "all-meta", "wav"]
